# Default Behavior Settings

> Core behavior configuration for the Atlas/GOTCHA framework.
> These defaults apply when no specific args file is loaded.

---

## Communication Style

| Setting | Default | Options |
|----------|---------|----------|
| Voice | direct | direct, professional, casual, friendly |
| Format | markdown | markdown, json, html |
| Length | concise | concise, verbose, full |
| Updates | minimal | minimal, standard, detailed |

