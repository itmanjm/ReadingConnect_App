## Specialized Models

| Use Case | Recommended Model | Reason |
|-----------|-------------------|--------|
| Coding | claude-3.5-sonnet | Better for code, follows instructions |
| Writing | claude-3-opus | Long context, nuanced tone |
| Summarization | gpt-4o-turbo | Fast, good compression |
| Research | claude-3-haiku | Analytical, careful reasoning |
| Image | gpt-4o | Vision capabilities |
| Voice | elevenlabs-multilingual-v2 | Natural speech (external) |

