<!DOCTYPE html>
<html>
<head>
  <title>Firebase Auth Test</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyCGc4EBAdLRdmfBd_08reVeXVt6a6OfirE",
      authDomain: "readingconnect-lit.firebaseapp.com",
      projectId: "readingconnect-lit",
      storageBucket: "readingconnect-lit.firebasestorage.app",
      messagingSenderId: "302745627563",
      appId: "1:302745627563:web:8c0c7ec22a8bba294f00ee",
      measurementId: "G-L3B7M9ZZMG"
    };
    
    try {
      const app = initializeApp(firebaseConfig);
      console.log("✅ Firebase initialized successfully!");
      document.getElementById('status').innerHTML = '✅ Firebase initialized successfully!';
      
      const auth = getAuth(app);
      
      // Test login
      window.testLogin = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
          const result = await signInWithEmailAndPassword(auth, email, password);
          document.getElementById('status').innerHTML = '✅ Login successful! User: ' + result.user.email;
        } catch (error) {
          document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
          console.error(error);
        }
      };
    } catch (error) {
      console.error("❌ Firebase init error:", error);
      document.getElementById('status').innerHTML = '❌ Firebase init error: ' + error.message;
    }
  </script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    input { display: block; margin: 10px 0; padding: 10px; width: 100%; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    #status { margin: 20px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Firebase Auth Test</h1>
  <div id="status">Loading...</div>
  
  <h2>Test Login</h2>
  <input type="email" id="email" placeholder="Email" value="teacher.test@readingconnect.com">
  <input type="password" id="password" placeholder="Password" value="TestTeacher123!">
  <button onclick="testLogin()">Test Login</button>
  
  <h2>Instructions</h2>
  <ol>
    <li>Check browser console (F12) for detailed logs</li>
    <li>Click "Test Login" button above</li>
    <li>See if login works in this isolated test</li>
  </ol>
</body>
</html>
