## Activities

```yaml
activity_types:
  phonemic_awareness:
    label: "Phonemic Awareness"
    description: "Learn to hear and manipulate sounds in words"
    icon: "volume-2"
    examples:
      - "Rhyming songs"
      - "Sound Detective"
      - "Clapping syllables"

  phonics:
    label: "Phonics"
    description: "Learn letters and their sounds"
    icon: "book-open"
    examples:
      - "Letter hunt"
      - "Magnetic letter word building"
      - "Sound hopscotch"

  sight_words:
    label: "Sight Words"
    description: "Recognize high-frequency words instantly"
    icon: "type"
    examples:
      - "Sight Word Bingo"
      - "Flashlight Tag"
      - "Word wall games"

  vocabulary:
    label: "Vocabulary"
    description: "Build understanding of word meanings"
    icon: "lightbulb"
    examples:
      - "Word of the Day"
      - "Labeling games"
      - "Picture dictionaries"

  fluency:
    label: "Fluency"
    description: "Read smoothly and with expression"
    icon: "zap"
    examples:
      - "Partner reading"
      - "Echo reading"
      - "Timed reading practice"

  comprehension:
    label: "Comprehension"
    description: "Understand what you read"
    icon: "brain"
    examples:
      - "Story retelling"
      - "Question cards"
      - "Drawing sequence"

  enjoyment:
    label: "Reading Enjoyment"
    description: "Discover joy of reading"
    icon: "heart"
    examples:
      - "Book Corner"
      - "Reading challenges"
      - "Story dramatization"

difficulty_levels:
  - value: "easy"
    label: "Easy"
    color: "green"
    description: "Perfect for beginners"
  - value: "medium"
    label: "Medium"
    color: "yellow"
    description: "Builds on skills"
  - value: "hard"
    label: "Hard"
    color: "red"
    description: "Challenge yourself"
```

---

## Constraints

```yaml
activity_limits:
  min_duration_minutes: 3
  max_duration_minutes: 30
  recommended_daily_activities: 3
  max_daily_activities: 10

classroom_settings:
  max_students_per_teacher: 50
  max_students_per_classroom: 25

file_constraints:
  max_audio_file_size_mb: 10
  max_recording_duration_seconds: 120
  pdf_page_limit: 20

privacy:
  minimum_age: 4
  require_parental_consent: true
  data_retention_days: 365
  anonymous_analytics_only: true
```

---

## Offline Support

```yaml
offline:
  enabled: true
  cache_activities_count: 10
  cache_audio_files: true
  sync_on_reconnect: true
  auto_cache_duration_hours: 24

indexeddb:
  database_name: "readinConnect-db"
  version: 1
  stores:
    - "activities"
    - "progress"
    - "sight_words"
    - "audio"
```

---

## Accessibility

```yaml
accessibility:
  wcag_level: "AA"
  high_contrast_mode: true
  keyboard_navigation: true
  screen_reader_support: true
  touch_target_size: 44  # pixels (WCAG recommended)
  reduce_motion_preference: true
  caption_all_audio: true

font_sizes:
  base: 16  # pixels
  scale: [0.875, 1, 1.125, 1.25, 1.5]
  large_text_mode: 1.5  # 150%
```

---

## Development Settings

```yaml
dev:
  auto_migrations: true
  seed_sample_data: true
  enable_debug_logs: true
  hot_reload: true

testing:
  test_user_accounts: true
  mock_firebase: false  # Set to true for offline testing
  test_data_file: "tools/database/test_data.json"
```

