# Literacy Learning App — Args Configuration

> Behavior settings for ReadinConnect App
> Change these values without modifying goals or tools

---

## Environment

```yaml
development:
  node_version: "18.x"
  package_manager: "npm"
  app_name: "readinConnect"
  display_name: "ReadinConnect"

firebase:
  project_id: "${FIREBASE_PROJECT_ID}"
  api_key: "${FIREBASE_API_KEY}"
  auth_domain: "${FIREBASE_AUTH_DOMAIN}"
  storage_bucket: "${FIREBASE_STORAGE_BUCKET}"
  messaging_sender_id: "${FIREBASE_MESSAGING_SENDER_ID}"
  app_id: "${FIREBASE_APP_ID}"
```

---

## Features

```yaml
enabled_features:
  phonics_activities: true
  sight_word_bingo: true
  fluency_tracking: true
  comprehension_quizzes: true
  vocabulary_builder: true
  gamification: true
  printables: true
  offline_support: true
  teacher_dashboard: true
  parent_portal: true
  audio_tts: true
  audio_stt: false  # Speech-to-text is advanced; enable later

disabled_features:
  - social_sharing  # Privacy for children
  - third_party_analytics  # Use PostHog only if needed
```

